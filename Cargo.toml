[package]
edition = "2024"
name = "conspire"
publish = false
version = "0.6.5"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
conspire = { path = "../conspire.rs", features = ["constitutive", "doc"] }
[dependencies]
conspire = { path = "../conspire.rs", features = ["constitutive", "doc"] }
ndarray = { version = "=0.17.2" }
numpy = { version = "=0.29.0" }
pyo3 = { features = ["extension-module"], version = "=0.29.3" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
