[package]
edition = "2024"
# name = "conspire"
name = "foo"
publish = false
version = "0.6.4"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
# conspire = { version = "=0.6.3", features = ["doc", "fem"] }
conspire = { path = "../conspire.rs", features = ["doc", "fem"] }

[dependencies]
# conspire = { version = "=0.6.3", features = ["doc", "fem"] }
conspire = { path = "../conspire.rs", features = ["doc", "fem"] }
ndarray = { version = "=0.17.2" }
numpy = { version = "=0.27.1" }
pyo3 = { features = ["extension-module"], version = "=0.27.2" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
